version: '3.8'

services:
  # ===========================================================================
  # Neo4j Graph Database (v5 with APOC Plugins enabled)
  # ===========================================================================
  neo4j:
    image: neo4j:5.26.0
    container_name: graphrag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser HTTP UI
      - "7687:7687" # Bolt binary protocol
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - ./data/processed:/var/lib/neo4j/import/processed:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - graphrag-net

  # ===========================================================================
  # Qdrant Vector Search Engine
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: graphrag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # Qdrant HTTP REST API & Web UI
      - "6334:6334" # Qdrant gRPC API
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - graphrag-net

volumes:
  neo4j_data:
    name: graphrag_neo4j_data
  neo4j_logs:
    name: graphrag_neo4j_logs
  neo4j_import:
    name: graphrag_neo4j_import
  qdrant_data:
    name: graphrag_qdrant_data

networks:
  graphrag-net:
    name: graphrag-network
    driver: bridge

